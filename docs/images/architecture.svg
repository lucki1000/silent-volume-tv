<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description">
  <title id="title">How Silent Volume TV works</title>
  <desc id="description">The Bluetooth remote connects to an ESP32 bridge. The bridge forwards other supported keys to the TV over Bluetooth, and sends volume up and down over Wi-Fi and authenticated HTTP to the Silent Volume TV app running on the TV.</desc>
  <defs>
    <marker id="ble-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#79d5c5"/>
    </marker>
    <marker id="http-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#91bfff"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="418" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <rect x="28" y="168" width="174" height="104" rx="12" fill="#161b22" stroke="#526170" stroke-width="2"/>
  <rect x="292" y="168" width="182" height="104" rx="12" fill="#142b29" stroke="#79d5c5" stroke-width="2"/>
  <rect x="622" y="58" width="290" height="330" rx="14" fill="#161b22" stroke="#526170" stroke-width="2"/>
  <rect x="646" y="220" width="242" height="94" rx="10" fill="#18283e" stroke="#91bfff" stroke-width="2"/>

  <path d="M 202 220 H 281" fill="none" stroke="#79d5c5" stroke-width="3" marker-end="url(#ble-arrow)"/>
  <path d="M 383 168 V 106 H 610" fill="none" stroke="#79d5c5" stroke-width="3" stroke-linejoin="round" marker-end="url(#ble-arrow)"/>
  <path d="M 474 267 H 634" fill="none" stroke="#91bfff" stroke-width="3" marker-end="url(#http-arrow)"/>
  <path d="M 767 314 V 336" fill="none" stroke="#91bfff" stroke-width="3" marker-end="url(#http-arrow)"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="115" y="213" font-size="25" font-weight="bold" fill="#f0f6fc">Remote</text>
    <text x="115" y="246" font-size="17" fill="#b6c2cf">Bluetooth LE</text>
    <text x="383" y="213" font-size="24" font-weight="bold" fill="#f0f6fc">ESP32 bridge</text>
    <text x="383" y="246" font-size="16" fill="#b6c2cf">Intercepts volume</text>
    <text x="767" y="104" font-size="26" font-weight="bold" fill="#f0f6fc">Android TV</text>
    <text x="767" y="252" font-size="23" font-weight="bold" fill="#f0f6fc">Silent Volume TV</text>
    <text x="767" y="283" font-size="17" fill="#b6c2cf">Android app</text>

    <text x="244" y="203" font-size="17" fill="#79d5c5">BLE</text>
    <text x="499" y="82" font-size="18" fill="#79d5c5">Other keys · Bluetooth</text>
    <text x="548" y="218" font-size="19" font-weight="bold" fill="#91bfff">Volume + / −</text>
    <text x="548" y="245" font-size="17" fill="#91bfff">Wi-Fi / HTTP</text>
    <text x="767" y="364" font-size="17" fill="#b6c2cf">Media volume + small overlay</text>
  </g>
</svg>
